x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: chatapp
  DB_USER: chatuser
  DB_PASSWORD: chatpass
  DB_SCHEMA: public
  DB_POOL_SIZE: "10"
  DB_MIN_IDLE: "2"
  DB_CONNECTION_TIMEOUT_MS: "30000"
  DB_SSL: "false"

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DATABASE: "0"
  REDIS_SSL: "false"
  REDIS_MAX_POOL_SIZE: "10"
  REDIS_MIN_IDLE: "2"
  REDIS_MAX_IDLE: "5"
  REDIS_CONNECTION_TIMEOUT_MS: "30000"

services:
  redis:
    image: redis:8.4.1-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chatnet

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: chatapp
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatapp"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chatnet

  api-server-1:
    image: chatserver/api-server:latest
    container_name: api-server-1
    environment:
      <<: [*db-env, *redis-env]
      REDIS_URL: redis://redis:6379
      SERVER_ID: api-server-1
      JWT_SECRET: production-secret-change-me
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chatnet

  api-server-2:
    image: chatserver/api-server:latest
    container_name: api-server-2
    environment:
      <<: [*db-env, *redis-env]
      REDIS_URL: redis://redis:6379
      SERVER_ID: api-server-2
      JWT_SECRET: production-secret-change-me
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chatnet

  worker-1:
    image: chatserver/worker:latest
    container_name: worker-1
    environment:
      <<: [*db-env, *redis-env]
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker-1
      SERVER_ID: worker-1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chatnet

  worker-2:
    image: chatserver/worker:latest
    container_name: worker-2
    environment:
      <<: [*db-env, *redis-env]
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker-2
      SERVER_ID: worker-2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chatnet

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-server-1
      - api-server-2
    networks:
      - chatnet

volumes:
  redis-data:
  postgres-data:

networks:
  chatnet:
    driver: bridge

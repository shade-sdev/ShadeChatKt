# ========================
# Nginx config for Chat App
# ========================

events {
    worker_connections 1024;
}

http {
    # ------------------------
    # Upstream backend servers
    # ------------------------
    upstream api_backend {
        # Round-robin load balancing with sticky sessions
        server api-server-1:8080;
        server api-server-2:8080;
    }

    # Map Upgrade header for WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # ------------------------
        # WebSocket endpoint
        # ------------------------
        location /ws {
            proxy_pass http://api_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Disable buffering for WS
            proxy_buffering off;
        }

        # ------------------------
        # LiveKit Webhook endpoint
        # ------------------------
        location /livekit/webhook {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------
        # HTTP API endpoints
        # ------------------------
        location / {
            proxy_pass http://api_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optional: caching disabled
            proxy_buffering off;
        }
    }
}
